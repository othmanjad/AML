server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # API and health check are forwarded to the API container (same origin: no CORS needed).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location = /health { proxy_pass http://api:8080/health; }
    location /swagger { proxy_pass http://api:8080; proxy_set_header Host $host; }

    # Single-page application: unknown paths load index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
    location = /index.html { add_header Cache-Control "no-store"; }
}
